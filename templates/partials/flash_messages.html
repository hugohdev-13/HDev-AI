{% with messages = get_flashed_messages(with_categories=true) %}
{% if messages %}
    {% for category, message in messages %}
        <div class="app-alert alert alert-{{ category }} alert-dismissible fade show" role="alert">
            <i class="bi {% if category == 'success' %}bi-check-circle-fill{% elif category in ['danger', 'warning'] %}bi-exclamation-triangle-fill{% else %}bi-info-circle-fill{% endif %}"></i>
            <span>{{ message }}</span>
            <button class="btn-close ms-auto" data-bs-dismiss="alert" aria-label="Cerrar"></button>
        </div>
    {% endfor %}
{% endif %}
{% endwith %}
